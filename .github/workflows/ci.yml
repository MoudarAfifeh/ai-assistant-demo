name: CI

on:
   push:
   pull_request:

jobs:
   ci:
      runs-on: ubuntu-latest
      env:
         # Placeholder only: `prisma generate` reads it but never connects.
         # Tests stub Prisma, OpenAI and Upstash, so no secrets are needed.
         DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      steps:
         - uses: actions/checkout@v4

         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.3.14

         - name: Install dependencies
           run: bun install --frozen-lockfile

         - name: Generate Prisma client
           run: bun run --cwd packages/server build

         - name: Type-check server
           run: bunx tsc --noEmit -p packages/server

         - name: Type-check and build client
           run: bun run --cwd packages/client build

         - name: Lint client
           run: bun run --cwd packages/client lint

         - name: Test
           run: bun run test
